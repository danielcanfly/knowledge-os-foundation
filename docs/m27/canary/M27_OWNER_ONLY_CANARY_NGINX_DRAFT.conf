# Stage 28 owner-only canary route draft. Install only after candidate and auth health pass.
# The auth sidecar validates a private owner header and never forwards it to M27.
location = /_m27_owner_canary_auth {
    internal;
    proxy_pass http://127.0.0.1:18081/m27-owner-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-M27-Owner-Canary-Auth $http_x_m27_owner_canary_auth;
    proxy_set_header X-Original-URI $request_uri;
}

location = /v1/answers {
    auth_request /_m27_owner_canary_auth;
    error_page 401 403 500 502 503 504 = @m27_owner_canary_m26_fallback;
    proxy_pass http://127.0.0.1:18080/v1/answers/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-M27-Owner-Canary-Auth "";
    proxy_set_header X-M27-Canary-Route-Id "m27-owner-only-stage28";
    proxy_set_header X-M27-Canary-Mode "owner_only";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location @m27_owner_canary_m26_fallback {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}
